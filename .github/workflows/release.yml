name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Gradle 권한 설정
        run: chmod +x gradlew

      - name: 테스트 실행
        run: ./gradlew test

      - name: JAR 빌드
        run: ./gradlew build

      - name: GitHub Release 생성 및 JAR 업로드
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            opendart-reader-core/build/libs/*.jar
            opendart-reader-spring-boot-starter/build/libs/*.jar
